<div class="container my-5">
  <h5 class="bg-dark text-white text-center w-50 py-3 rounded-3">
    {{ title }}
  </h5>
  <div class="product d-flex gap-4 align-items-center my-4">
    <p>Products:</p>
    @for (product of products; track $index) {
      <p class="bg-success text-white text-center w-25 py-2 rounded-2">
        {{ product }}
      </p>
    }
  </div>
</div>
